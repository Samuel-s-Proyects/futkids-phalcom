name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHPUnit (SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phalcon-5.22.1, pdo_sqlite, pdo_mysql, intl, gd, mbstring, fileinfo
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run tests
        run: composer test

  node:
    name: Front-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm --prefix tests test
